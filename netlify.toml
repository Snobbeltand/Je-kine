[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site is a single-page app: every path is served index.html and
# React Router picks the page, so /over-ons etc. work on refresh and direct links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built assets have content hashes in their filenames, so they can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
